<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ScamWise Warning</title>
  <link rel="stylesheet" href="warning.css" />
</head>
<body>
  <main class="wrap">
    <h1 id="title">Warning: suspicious site</h1>
    <p id="subtitle" class="sub"></p>
    <p id="url" class="url"></p>
    <ul id="reasons" class="reasons"></ul>
    <div class="row">
      <button id="back" type="button">Go back</button>
      <button id="proceed" type="button">Proceed anyway (24h)</button>
    </div>
  </main>
  <script src="warning.js"></script>
</body>
</html>
