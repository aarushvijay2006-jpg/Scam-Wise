<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
body{font:16px sans-serif;max-width:640px;margin:40px auto;padding:20px;background:#fff5f5;color:#111}
.card{border:3px solid #e03131;border-radius:12px;padding:24px;background:#fff}
button{padding:12px 18px;margin:6px;cursor:pointer;font-size:15px}
.back{background:#1971c2;color:#fff;border:none;border-radius:8px}
.proceed{background:#eee;border:1px solid #999;border-radius:8px}
code{background:#f1f3f5;padding:2px 6px;word-break:break-all}
</style></head><body><div class="card">
<h2>Blocked: suspected phishing</h2>
<p><b id="level"></b> - Score <b id="score"></b>/100</p>
<p>Blocked URL: <code id="url"></code></p>
<h3>Why this is dangerous:</h3><ul id="reasons"></ul>
<p>Banks never ask for OTP on a link. Do not enter password / OTP.</p>
<button class="back" id="back">Go Back to Safety</button>
<button class="proceed" id="go">Proceed Anyway (unsafe)</button>
<p id="confirm" style="display:none">Click again to confirm you understand the risk. Whitelists for 24h.</p>
</div><script src="warning.js"></script></body></html>
